<meta charset="UTF-8">

<title>RACE//MONEY</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    color: white;
    text-align: center;
    background: radial-gradient(circle at top, #25252f, #0c0c10 72%);
}

header {
    padding: 20px;
    background: #17171d;
    border-bottom: 2px solid #333;
}

h1 {
    margin: 0;
    color: #ffae42;
    text-shadow: 0 0 18px #ff8500;
}

#money {
    margin-top: 8px;
    color: #69ff79;
    font-size: 21px;
    font-weight: bold;
}

.container {
    width: min(920px, 94%);
    margin: auto;
    padding: 15px;
}

h2 {
    margin-bottom: 10px;
}

.difficulties {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    margin: 12px 0;
}

button {
    border: none;
    border-radius: 12px;
    padding: 12px 17px;
    margin: 5px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: transform .12s, background .12s, box-shadow .12s;
}

button:hover {
    transform: translateY(-2px);
}

button:active {
    transform: scale(.96);
}

.difficulties button {
    background: #25252e;
    color: white;
}

.difficulties button.selected {
    background: #ff9418;
    box-shadow: 0 0 13px #ff9418;
}

.track {
    position: relative;
    height: 240px;
    margin: 20px 0;
    overflow: hidden;
    border: 5px solid #222;
    border-radius: 20px;

    background:
        repeating-linear-gradient(
            90deg,
            #343434 0px,
            #343434 45px,
            #3c3c3c 45px,
            #3c3c3c 90px
        );
}

.track::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 5px;
    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 25px,
            #ddd 25px 55px
        );
    opacity: .5;
}

.finish {
    position: absolute;
    right: 0;
    top: 0;
    width: 28px;
    height: 100%;
    z-index: 3;

    background:
        repeating-linear-gradient(
            0deg,
            white 0 15px,
            black 15px 30px
        );
}

.car {
    position: absolute;
    width: 65px;
    height: 38px;
    border-radius: 10px;
    transition: left .12s linear;
    z-index: 4;
}

.player {
    top: 48px;
    background: #ff4141;
    box-shadow: 0 0 15px #ff4141;
}

.ai {
    top: 145px;
    background: #438cff;
    box-shadow: 0 0 15px #438cff;
}

.player::after {
    content: "🏎️";
    position: absolute;
    left: 8px;
    top: -5px;
    font-size: 36px;
}

.ai::after {
    content: "🚗";
    position: absolute;
    left: 8px;
    top: -5px;
    font-size: 36px;
}

.status {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.stat {
    padding: 13px;
    border-radius: 12px;
    border: 1px solid #333;
    background: #1b1b23;
}

.stat strong {
    display: block;
    margin-top: 5px;
    font-size: 20px;
}

.nitroBox {
    height: 10px;
    margin-top: 7px;
    overflow: hidden;
    border-radius: 10px;
    background: #333;
}

#nitroBar {
    width: 100%;
    height: 100%;
    background: #19c7ff;
    transition: width .2s;
}

#message {
    min-height: 32px;
    margin: 12px;
    font-size: 18px;
    font-weight: bold;
}

#driveBtn {
    width: 90%;
    max-width: 520px;
    padding: 22px;
    color: white;
    background: #ff9418;
    box-shadow: 0 0 20px #ff7200;
    font-size: 22px;
}

#nitroBtn {
    color: white;
    background: #16bce9;
}

.garage,
.settings {
    margin-top: 25px;
    padding: 18px;
    border-radius: 16px;
    border: 1px solid #30303a;
    background: #17171e;
}

.upgradeGrid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
}

.upgrade {
    min-height: 100px;
    margin: 0;
    color: white;
    background: #282832;
}

.upgrade:hover {
    background: #383844;
}

.upgrade span {
    display: block;
    margin-bottom: 5px;
    font-size: 23px;
}

.upgrade small {
    display: block;
    margin-top: 5px;
    color: #aaa;
}

.settingsRow {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    margin: 13px 0;
}

.settings select {
    max-width: 95%;
    padding: 11px;
    color: white;
    border: 1px solid #444;
    border-radius: 10px;
    background: #282832;
}

.soundButton,
.musicButton {
    min-width: 80px;
    color: white;
    background: #282832;
}

.saveButton {
    color: white;
    background: #38b85a;
}

.resetButton {
    color: white;
    background: #c83b3b;
}

.raceInfo {
    margin-top: 15px;
    padding: 12px;
    color: #aaa;
    border-radius: 12px;
    background: #191920;
}

#musicStatus {
    color: #72d9ff;
    font-weight: bold;
}

@media(max-width: 700px) {
    .status {
        grid-template-columns: repeat(2, 1fr);
    }

    .upgradeGrid {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<header>
    <h1>🏁 RACE//MONEY</h1>
    <div id="money">💰 $0</div>
</header>

<div class="container">

    <h2 id="difficultyText"></h2>

        <button id="hardBtn" onclick="setDifficulty('hard', this)" data-i18n="hard">HARD</button>
        <button id="insaneBtn" onclick="setDifficulty('insane', this)" data-i18n="insane">INSANE</button>
    </div>

        <div class="finish"></div>
        <div id="playerCar" class="car player"></div>
        <div id="aiCar" class="car ai"></div>
    </div>

    </div>

    <div id="message"></div>

    <br>

                <small id="accelInfo">$175</small>
            </button>

            <button class="upgrade" onclick="upgrade('sponsor')">
                <span>🪙</span>
                <span data-i18n="sponsor">Sponsor</span>
                <small id="sponsorInfo">$250</small>
            </button>

        </div>
    </div>

    <div class="settings">

        <h2>
            ⚙️ <span data-i18n="settings">SETTINGS</span>
        </h2>

        <div class="settingsRow">

            <label for="language">

            </label>

            <select id="language" onchange="changeLanguage(this.value)">

                <option value="zh-tw">繁體中文</option>
                <option value="vi">Tiếng Việt</option>
                <option value="id">Bahasa Indonesia</option>

            </select>
        </div>

        <div class="settingsRow">

            <span>
                🔊 <span data-i18n="sound">Sound</span>:
            </span>

            <button class="soundButton" onclick="changeVolume(-10)">
                ➖
            </button>

            <strong id="soundText">100%</strong>

            <button class="soundButton" onclick="changeVolume(10)">

            </button>

        </div>

        <div class="settingsRow">

                🎵 <span data-i18n="music">Music</span>:

                </option>

        </div>

        <div class="settingsRow">

            </span>

            </span>

        </div>

        <div class="settingsRow">

            Nitro gives you a temporary burst.
        </span>

    </div>

</div>

const languageAliases = {

        languageAliases[currentLanguage] ||

        translations.en[key] ??
        key
    );
}


/* =========================================================

   ========================================================= */

function numberSave(key, fallbackValue) {

    const value = localStorage.getItem(key);

    if (value === null)
        return fallbackValue;

    const n = Number(value);

    return Number.isFinite(n)
        ? n
        : fallbackValue;
}

/* =========================================================
   AUDIO
   ========================================================= */

let audioContext = null;
let musicTimer = null;
let musicPlaying = false;
let musicIndex = 0;


function getAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (
        audioContext.state === "suspended"
    ) {

        audioContext.resume();

    }

    return audioContext;

}


/* =========================================================
   SOUND EFFECTS
   ========================================================= */

function beep(
    frequency,
    duration,
    type = "sine",
    volume = 0.05
) {

    if (soundVolume <= 0)
        return;

    const ctx = getAudio();

    const oscillator =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
        frequency;

    gain.gain.value =
        volume *
        (soundVolume / 100);

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start();

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + duration
    );

    oscillator.stop(
        ctx.currentTime + duration
    );

}


function playSound(type) {

    if (soundVolume <= 0)
        return;

    if (type === "click") {

        beep(
            320,
            .05,
            "square",
            .035
        );

    }

    else if (type === "drive") {

            .05
        );

        setTimeout(

                beep(
                    240,
                    .06,
                    "sawtooth",
                    .04
                ),
            65
        );

    }

    else if (type === "nitro") {

        beep(
            500,
            .08,
            "sawtooth",
            .05
        );

        setTimeout(
            () =>
                beep(
                    850,
                    .12,
                    "sawtooth",
                    .06
                ),
            70
        );

    }

    else if (type === "upgrade") {

        beep(
            450,
            .08,
            "square",
            .04
        );

        setTimeout(
            () =>
                beep(
                    650,
                    .1,
                    "square",
                    .045
                ),
            90
        );

    }

    else if (type === "win") {

        beep(
            523.25,
            .12,
            "sine",
            .06
        );

        setTimeout(
            () =>
                beep(
                    659.25,
                    .12,
                    "sine",
                    .06
                ),
            120
        );

        setTimeout(
            () =>
                beep(
                    783.99,
                    .2,
                    "sine",
                    .07
                ),

        );

    }

    else if (type === "lose") {

        beep(
            220,
            .15,
            "sawtooth",
            .05
        );

        setTimeout(
            () =>
                beep(
                    150,
                    .25,
                    "sawtooth",
                    .05
                ),
            160
        );

    }

}


/* =========================================================
   MUSIC
   ========================================================= */

const NOTE = {

    C4:261.63,
    D4:293.66,
    E4:329.63,
    F4:349.23,
    G4:392.00,
    A4:440.00,
    B4:493.88,

    C5:523.25,
    D5:587.33,
    E5:659.25,
    F5:698.46,
    G5:783.99,
    A5:880.00,
    B5:987.77,

    C6:1046.50

};


const casualMelody = [

    [NOTE.C4, .30],
    [NOTE.E4, .30],
    [NOTE.G4, .30],
    [NOTE.A4, .30],

    [NOTE.G4, .30],
    [NOTE.E4, .30],
    [NOTE.D4, .30],
    [NOTE.C4, .45],

    [NOTE.E4, .30],
    [NOTE.G4, .30],
    [NOTE.B4, .30],
    [NOTE.A4, .30],

    [NOTE.G4, .30],
    [NOTE.E4, .30],
    [NOTE.C4, .55]

];


const nightMelody = [

    [NOTE.G5,.18],
    [NOTE.G5,.18],
    [NOTE.G5,.18],
    [NOTE.D5,.35],

    [NOTE.B4,.18],
    [NOTE.D5,.18],
    [NOTE.G5,.18],
    [NOTE.B5,.35],

    [NOTE.A5,.18],
    [NOTE.G5,.18],
    [NOTE.F5,.18],
    [NOTE.E5,.35],

    [NOTE.D5,.18],
    [NOTE.G5,.18],
    [NOTE.B5,.18],
    [NOTE.G5,.45]

];


const joyMelody = [

    [NOTE.E4,.35],
    [NOTE.E4,.35],
    [NOTE.F4,.35],
    [NOTE.G4,.35],

    [NOTE.G4,.35],
    [NOTE.F4,.35],
    [NOTE.E4,.35],
    [NOTE.D4,.35],

    [NOTE.C4,.35],
    [NOTE.C4,.35],
    [NOTE.D4,.35],
    [NOTE.E4,.35],

    [NOTE.E4,.5],
    [NOTE.D4,.2],
    [NOTE.D4,.6],

    [NOTE.E4,.35],
    [NOTE.E4,.35],
    [NOTE.F4,.35],
    [NOTE.G4,.35],

    [NOTE.G4,.35],
    [NOTE.F4,.35],
    [NOTE.E4,.35],
    [NOTE.D4,.35],

    [NOTE.C4,.35],
    [NOTE.C4,.35],
    [NOTE.D4,.35],
    [NOTE.E4,.35],

    [NOTE.D4,.5],
    [NOTE.C4,.2],
    [NOTE.C4,.6]

];


function getMelody() {

    if (selectedMusic === "casual")
        return casualMelody;

    if (selectedMusic === "night")
        return nightMelody;

    if (selectedMusic === "joy")
        return joyMelody;

    return null;

}


function musicNote(
    frequency,
    duration
) {

    if (soundVolume <= 0)
        return;

    const ctx = getAudio();

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    osc.type = "triangle";

    osc.frequency.value =
        frequency;

    gain.gain.value =
        .025 *
        (soundVolume / 100);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        .001,
        ctx.currentTime + duration
    );

    osc.stop(
        ctx.currentTime + duration
    );

}


function playMusicStep() {

    if (!musicPlaying)
        return;

    const melody =
        getMelody();

    if (!melody)
        return;

    const note =
        melody[musicIndex];

    musicNote(
        note[0],
        note[1]
    );

    musicIndex++;

    if (
        musicIndex >=
        melody.length
    ) {

        musicIndex = 0;

    }

    musicTimer =
        setTimeout(
            playMusicStep,
            note[1] * 1000
        );

}


function stopMusic() {

    musicPlaying = false;
    musicIndex = 0;

    if (musicTimer) {

        clearTimeout(
            musicTimer
        );

        musicTimer = null;

    }

}


function startMusic() {

    stopMusic();

    if (selectedMusic === "off") {

        updateMusicStatus();

        return;

    }

    musicPlaying = true;
    musicIndex = 0;

    playMusicStep();

    updateMusicStatus();

}


function changeMusic(value) {

    selectedMusic = value;

    localStorage.setItem(
        "raceMusic",
        selectedMusic
    );

    startMusic();

    playSound("click");

}


function updateMusicStatus() {

    const keys = {

        off:"musicOff",
        casual:"musicCasual",
        night:"musicNight",
        joy:"musicJoy"

    };

    document.getElementById(
        "musicStatus"
    ).textContent =
        T(keys[selectedMusic] || "musicOff");

}


/* =========================================================
   UI
   ========================================================= */

function updateUI() {

    document.getElementById(
        "money"
    ).textContent =
        "💰 $" + money;


    const speed =
        10 +
        upgrades.engine * .85;


    document.getElementById(
        "speedText"
    ).textContent =
        speed.toFixed(1);


    document.getElementById(
        "gripText"
    ).textContent =
        upgrades.grip;


    document.getElementById(
        "accelText"
    ).textContent =
        upgrades.acceleration;


    document.getElementById(
        "nitroBar"
    ).style.width =
        nitro + "%";


    document.getElementById(
        "engineInfo"
    ).textContent =
        "$" +
        upgrades.engine * 100;


    document.getElementById(
        "gripInfo"
    ).textContent =
        "$" +
        upgrades.grip * 150;


    document.getElementById(
        "nitroInfo"
    ).textContent =
        "$" +
        upgrades.nitro * 200;


    document.getElementById(
        "accelInfo"
    ).textContent =
        "$" +
        upgrades.acceleration * 175;


    document.getElementById(
        "sponsorInfo"
    ).textContent =
        "$" +
        upgrades.sponsor * 250;


    document.getElementById(
        "soundText"
    ).textContent =
        soundVolume + "%";


    document.getElementById(
        "language"
    ).value =
        currentLanguage;


    document.getElementById(
        "musicSelect"
    ).value =
        selectedMusic;


    updateMusicStatus();

}


/* =========================================================
   LANGUAGE SYSTEM
   ========================================================= */

function applyLanguage() {

    const realLanguage =
        languageAliases[currentLanguage] ||
        currentLanguage;


    document.documentElement.lang =
        currentLanguage;


    document.documentElement.dir =
        rtlLanguages.includes(currentLanguage)
            ? "rtl"
            : "ltr";


    document
        .querySelectorAll("[data-i18n]")
        .forEach(function(element) {

            const key =
                element.dataset.i18n;

            element.textContent =
                T(key);

        });


    updateDifficultyText();


    if (!racing) {

        document.getElementById(
            "message"
        ).textContent =
            T("choose");

    }


    updateMusicStatus();

}


function changeLanguage(language) {

    if (!translations[
        languageAliases[language] ||
        language
    ]) {

        language = "en";

    }


    currentLanguage =
        language;


    localStorage.setItem(
        "raceLanguage",
        currentLanguage
    );


    applyLanguage();

    playSound("click");

}


/* =========================================================
   DIFFICULTY
   ========================================================= */

function updateDifficultyText() {

    document.getElementById(
        "difficultyText"
    ).textContent =
        T("difficulty") +
        ": " +
        T(difficulty);

}


function setDifficulty(
    level,
    button
) {

    difficulty = level;


    document
        .querySelectorAll(
            ".difficulties button"
        )
        .forEach(function(btn) {

            btn.classList.remove(
                "selected"
            );

        });


    button.classList.add(
        "selected"
    );


    localStorage.setItem(
        "raceDifficulty",
        difficulty
    );


    updateDifficultyText();

    resetRace();

    playSound("click");

}


/* =========================================================
   SAVE
   ========================================================= */

function saveProgress() {

    localStorage.setItem(
        "raceMoney",
        money
    );

    localStorage.setItem(
        "raceEngine",
        upgrades.engine
    );

    localStorage.setItem(
        "raceGrip",
        upgrades.grip
    );

    localStorage.setItem(
        "raceNitro",
        upgrades.nitro
    );

    localStorage.setItem(
        "raceAcceleration",
        upgrades.acceleration
    );

    localStorage.setItem(
        "raceSponsor",
        upgrades.sponsor
    );

    localStorage.setItem(
        "raceSound",
        soundVolume
    );

    localStorage.setItem(
        "raceDifficulty",
        difficulty
    );

    localStorage.setItem(
        "raceLanguage",
        currentLanguage
    );

    localStorage.setItem(
        "raceMusic",
        selectedMusic
    );

}


function manualSave() {

    saveProgress();

    playSound("click");

    document.getElementById(
        "message"
    ).textContent =
        T("saved");

}


/* =========================================================
   RESET SAVE
   ========================================================= */

function resetProgress() {

    if (
        !confirm(
            "Reset ALL RACE//MONEY progress?"
        )
    ) {

        return;

    }


    const keys = [

        "raceMoney",
        "raceEngine",
        "raceGrip",
        "raceNitro",
        "raceAcceleration",
        "raceSponsor",
        "raceSound",
        "raceDifficulty",
        "raceLanguage",
        "raceMusic"

    ];


    keys.forEach(function(key) {

        localStorage.removeItem(key);

    });


    money = 0;


    upgrades = {

        engine:1,
        grip:1,
        nitro:1,
        acceleration:1,
        sponsor:1

    };


    difficulty = "normal";
    currentLanguage = "en";
    soundVolume = 100;
    selectedMusic = "off";


    stopMusic();

    resetRace();


    document
        .querySelectorAll(
            ".difficulties button"
        )
        .forEach(function(btn) {

            btn.classList.remove(
                "selected"
            );

        });


    document.getElementById(
        "normalBtn"
    ).classList.add(
        "selected"
    );


    updateUI();

    applyLanguage();

    playSound("click");


    document.getElementById(
        "message"
    ).textContent =
        T("resetMsg");

}


/* =========================================================
   NORMAL DRIVE DISTANCE
   ========================================================= */

function getNormalDriveDistance() {

    const baseSpeed =
        4.5 +
        upgrades.engine * .42;


    const accelerationBonus =
        upgrades.acceleration * .30;


    const randomRange =
        Math.max(
            .8,
            1.4 -
            upgrades.grip * .055
        );


    const randomMovement =
        Math.random() *
        randomRange;


    return (
        baseSpeed +
        accelerationBonus +
        randomMovement
    );

}


/* =========================================================
   DRIVE
   ========================================================= */

function drive() {

    if (!racing) {

        racing = true;

        document.getElementById(
            "message"
        ).textContent =
            T("go");


        if (
            selectedMusic !== "off" &&
            !musicPlaying
        ) {

            startMusic();

        }

    }


    playSound("drive");


    playerProgress +=
        getNormalDriveDistance();


    updateCars();

    updateUI();

    checkWinner();

}


/* =========================================================
   AI
   ========================================================= */

setInterval(function() {

    if (!racing)
        return;


    const ai =
        difficulties[difficulty];


    const variation =
        (Math.random() - .5) * .75;


    aiProgress +=
        ai.aiSpeed +
        variation;


    if (aiProgress < 0)
        aiProgress = 0;


    updateCars();

    checkWinner();

}, 300);


/* =========================================================
   NITRO
   ========================================================= */

function useNitro() {

    if (!racing) {

        document.getElementById(
            "message"
        ).textContent =
            T("startFirst");

        return;

    }


    if (nitro < 20) {

        document.getElementById(
            "message"
        ).textContent =
            T("noNitro");

        return;

    }


    /*
        Nitro is exactly 1.25x
        the distance of a normal drive.
    */

    const normalDistance =
        getNormalDriveDistance();


    const boost =
        normalDistance * 1.25;


    playerProgress +=
        boost;


    nitro -= 20;


    document.getElementById(
        "message"
    ).textContent =
        T("nitroMsg") +
        " +" +
        boost.toFixed(1) +
        "%";


    playSound("nitro");

    updateCars();
    updateUI();
    checkWinner();

}


/* =========================================================
   CARS
   ========================================================= */

function updateCars() {

    const track =
        document.querySelector(
            ".track"
        );


    const maxPosition =
        track.clientWidth - 100;


    const playerX =
        Math.min(
            playerProgress / 100 *
            maxPosition,
            maxPosition
        );


    const aiX =
        Math.min(
            aiProgress / 100 *
            maxPosition,
            maxPosition
        );


    document.getElementById(
        "playerCar"
    ).style.left =
        playerX + "px";


    document.getElementById(
        "aiCar"
    ).style.left =
        aiX + "px";

}


/* =========================================================
   WINNER
   ========================================================= */

function checkWinner() {

    if (
        playerProgress >= 100
    ) {

        finishRace(true);

    }

    else if (
        aiProgress >= 100
    ) {

        finishRace(false);

    }

}


/* =========================================================
   FINISH
   ========================================================= */

function finishRace(playerWon) {

    if (!racing)
        return;


    racing = false;


    if (playerWon) {

        const baseReward =
            difficulties[difficulty]
                .reward;


        const sponsorBonus =
            Math.floor(
                baseReward *
                (upgrades.sponsor - 1) *
                .018
            );


        const reward =
            baseReward +
            sponsorBonus;


        money += reward;


        document.getElementById(
            "message"
        ).textContent =
            T("won") +
            " +$" +
            reward;


        playSound("win");

        saveProgress();

    }

    else {

        document.getElementById(
            "message"
        ).textContent =
            T("lost");


        playSound("lose");

    }


    setTimeout(function() {

        raceNumber++;

        resetRace();

    }, 1800);

}


/* =========================================================
   RESET RACE
   ========================================================= */

function resetRace() {

    playerProgress = 0;
    aiProgress = 0;
    nitro = 100;
    racing = false;


    document.getElementById(
        "playerCar"
    ).style.left =
        "10px";


    document.getElementById(
        "aiCar"
    ).style.left =
        "10px";


    updateUI();

}


/* =========================================================
   UPGRADES
   ========================================================= */

function upgrade(type) {

    let cost;


    if (type === "engine")
        cost = upgrades.engine * 100;

    else if (type === "grip")
        cost = upgrades.grip * 150;

    else if (type === "nitro")
        cost = upgrades.nitro * 200;

    else if (type === "acceleration")
        cost = upgrades.acceleration * 175;

    else if (type === "sponsor")
        cost = upgrades.sponsor * 250;


    if (money < cost) {

        document.getElementById(
            "message"
        ).textContent =
            T("needMoney") +
            (cost - money);

        return;

    }


    money -= cost;

    upgrades[type]++;


    const names = {

        engine:"🚀 " + T("engine"),
        grip:"🛞 " + T("grip"),
        nitro:"⚡ " + T("nitroBoost"),
        acceleration:"💨 " + T("acceleration"),
        sponsor:"🪙 " + T("sponsor")

    };


    document.getElementById(
        "message"
    ).textContent =
        names[type] +
        " " +
        T("upgraded");


    playSound("upgrade");

    saveProgress();

    updateUI();

}


/* =========================================================
   VOLUME
   ========================================================= */

function changeVolume(amount) {

    soundVolume += amount;


    soundVolume =
        Math.max(
            0,
            Math.min(
                100,
                soundVolume
            )
        );


    localStorage.setItem(
        "raceSound",
        soundVolume
    );


    updateUI();


    if (soundVolume > 0)
        playSound("click");

}


/* =========================================================
   LOAD
   ========================================================= */

function loadSettings() {

    document.getElementById(
        "language"
    ).value =
        currentLanguage;


    document.getElementById(
        "musicSelect"
    ).value =
        selectedMusic;


    document
        .querySelectorAll(
            ".difficulties button"
        )
        .forEach(function(btn) {

            btn.classList.remove(
                "selected"
            );

        });


    const selectedButton =
        document.getElementById(
            difficulty + "Btn"
        );


    if (selectedButton) {

        selectedButton.classList.add(
            "selected"
        );

    }

}


/* =========================================================
   STARTUP
   ========================================================= */

loadSettings();

updateUI();

applyLanguage();

updateDifficultyText();

</script>
